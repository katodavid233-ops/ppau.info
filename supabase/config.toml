[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://localhost:8080/**",
  "https://ppau.info/**",
]

[storage]
enabled = true

# Public membership flows (no logged-in user) — use publishable key + service role inside function
[functions.create-application]
verify_jwt = false

[functions.submit-application]
verify_jwt = false

[functions.create-upload-url]
verify_jwt = false

[functions.initiate-flutterwave-payment]
verify_jwt = false

[functions.admin-resend-payment-email]
verify_jwt = false

[functions.admin-test-email]
verify_jwt = true

[functions.submit-contact]
verify_jwt = false

[functions.record-payment-proof]
verify_jwt = false

[functions.request-member-portal-access]
verify_jwt = false

[functions.cleanup-drafts]
verify_jwt = false
